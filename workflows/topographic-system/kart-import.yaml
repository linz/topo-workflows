# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v4.1.6/api/jsonschema/schema.json

# Runs stage 2 of kart-import (`process_all`, or `process_<repo>` for one repo) and saves each
# built target repo as a git bundle,
# downloadable from the workflow's artifacts in the Argo UI.
# See https://github.com/linz/topographic-system/tree/master/packages/kart-import#two-stages-extract-and-process
#
# - Stage 1 (`extract_all`: clone LDS sources and export per-commit parquets) needs an LDS SSH key,
#   so it runs elsewhere. Its output is published under `export_url`.
# - Stage 2 (this workflow) downloads only the exports it needs from `export_url`, then transforms
#   and imports them into Kart. No LDS or GitHub access is needed.
# - One pod runs the whole Snakemake pipeline. The cluster has no persistent volumes, so
#   Snakemake's `data/` folder lives on the pod's local disk and is thrown away afterwards.
# - Nothing is pushed to GitHub.
#
# To use a result: download `<repo>.bundle` from the workflow's artifacts, then
#   kart clone <repo>.bundle <repo>
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: topographic-kart-import
  labels:
    linz.govt.nz/category: topo-maps
    linz.govt.nz/data-type: vector
spec:
  entrypoint: main
  onExit: exit-handler
  podMetadata:
    labels:
      linz.govt.nz/category: topo-maps
      linz.govt.nz/data-type: vector
  arguments:
    parameters:
      - name: version_kart_cli
        description: Version of the kart CLI docker container to use
        value: 'latest'

      - name: repo
        description: Target repo to build, or `all` for every repo (`process_all`)
        value: 'all'
        enum:
          - 'all'
          - 'topographic-data'
          - 'topographic-product-data'
          - 'topographic-contour-data'

      - name: export_url
        description: Where stage 1 (`extract_all`) published its exports. Must be https:// (the image has no AWS CLI for s3://).
        value: 'https://d1jzh93b1t1cv.cloudfront.net/source/export/'

      - name: themes
        description: Comma separated list of themes to limit the build to, e.g. `airport,building`. Empty for all themes.
        value: ''

      - name: releases
        description: Comma separated list of Topo50 releases to limit the build to, e.g. `30,31,32`. Empty for all releases. Feature ids depend on the release range, so only a full build matches what would be published.
        value: ''

      - name: schema_check
        description: How to treat themes that don't match their schema. `warn` logs the problems and continues; `strict` fails the run. Currently `contour`, `nztopo50_grid` and `nztopo50_dms_grid` fail the check.
        value: 'warn'
        enum:
          - 'warn'
          - 'strict'

  templates:
    - name: main
      retryStrategy:
        expression: 'false'
      dag:
        tasks:
          - name: process
            template: process
            arguments:
              parameters:
                - name: version_kart_cli
                  value: '{{ workflow.parameters.version_kart_cli }}'
                - name: repo
                  value: '{{ workflow.parameters.repo }}'
                - name: export_url
                  value: '{{ workflow.parameters.export_url }}'
                - name: themes
                  value: '{{ workflow.parameters.themes }}'
                - name: releases
                  value: '{{ workflow.parameters.releases }}'
                - name: schema_check
                  value: '{{ workflow.parameters.schema_check }}'

    - name: process
      inputs:
        parameters:
          - name: version_kart_cli
          - name: repo
          - name: export_url
          - name: themes
          - name: releases
          - name: schema_check
      activeDeadlineSeconds: 86400 # 24 hours
      # A long single-pod run: a spot interruption would lose all progress
      nodeSelector:
        karpenter.sh/capacity-type: 'on-demand'
      tolerations:
        - key: 'karpenter.sh/capacity-type'
          operator: 'Equal'
          value: 'on-demand'
          effect: 'NoSchedule'
      container:
        image: ghcr.io/linz/topographic-system/kart:{{ inputs.parameters.version_kart_cli }}
        imagePullPolicy: Always
        workingDir: /workspace/packages/kart-import
        resources:
          # These pick the node: Karpenter gives the smallest on-demand `c` node with room for them.
          # Snakemake runs up to 64 jobs' worth of threads at once (`--cores 64`).
          requests:
            memory: 60Gi
            cpu: 128000m
            ephemeral-storage: 150Gi # nodes have 200GB
        env:
          - name: REPO
            value: '{{ inputs.parameters.repo }}'
          - name: THEMES
            value: '{{ inputs.parameters.themes }}'
          - name: RELEASES
            value: '{{ inputs.parameters.releases }}'
          - name: KART_EXPORT_URL
            value: '{{ inputs.parameters.export_url }}'
          - name: KART_SCHEMA_CHECK
            value: '{{ inputs.parameters.schema_check }}'
          # Needed until the image sets it: the pipeline's own `uv run` calls must not re-sync the
          # partial uv workspace in the image, or every step fails
          - name: UV_NO_SYNC
            value: '1'
          # The image has no git config, and kart needs an identity to commit
          - name: GIT_AUTHOR_NAME
            value: 'LINZ Topographic System' # placeholder
          - name: GIT_AUTHOR_EMAIL
            value: 'noreply@linz.govt.nz' # placeholder
          - name: GIT_COMMITTER_NAME
            value: 'LINZ Topographic System' # placeholder
          - name: GIT_COMMITTER_EMAIL
            value: 'noreply@linz.govt.nz' # placeholder
          # Where to send OpenTelemetry traces and metrics
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: otel-exporter
                key: OTEL_EXPORTER_OTLP_ENDPOINT
          - name: OTEL_EXPORTER_OTLP_HEADERS
            valueFrom:
              secretKeyRef:
                name: otel-exporter
                key: OTEL_EXPORTER_OTLP_HEADERS
        volumeMounts:
          - name: data
            mountPath: /workspace/packages/kart-import/data
        command: ['sh', '-c']
        args:
          - |
            set -eu

            if [ "$REPO" = "all" ]; then
              target=process_all
            else
              # snakemake targets use _ for -, e.g. process_topographic_data
              target="process_$(echo "$REPO" | tr '-' '_')"
              # No themes given: use only this repo's themes. Without a theme filter kart-import loads,
              # and schema-checks, every theme of every repo, so with schema_check=strict a problem in
              # another repo's theme would fail this build.
              if [ -z "$THEMES" ]; then
                THEMES=$(grep -l "^target_repo: $REPO\$" config/themes/*.yml | xargs -n1 basename | sed 's/\.yml$//' | paste -sd, -)
              fi
            fi

            # kart-import reads an empty KART_IMPORT_THEME/KART_IMPORT_RELEASE as "nothing",
            # so only set them when given
            if [ -n "$THEMES" ]; then export KART_IMPORT_THEME="$THEMES"; fi
            if [ -n "$RELEASES" ]; then export KART_IMPORT_RELEASE="$RELEASES"; fi
            echo "target=$target themes=${KART_IMPORT_THEME:-<all>} releases=${KART_IMPORT_RELEASE:-<all>} exports=$KART_EXPORT_URL node_cores=$(nproc)"

            # Stage 2: build the target repo(s) under data/output/<repo>/. --keep-going so a failure in
            # one repo (e.g. a missing export) doesn't stop the others; the run still fails at the end.
            status=0
            uv run --no-sync snakemake --cores 64 --keep-going "$target" || status=$?

            # Package each repo that finished as a single file for download
            for imported in data/output/*/.imported; do
              [ -e "$imported" ] || continue
              repo=$(basename "$(dirname "$imported")")
              git -C "data/output/$repo" bundle create "../$repo.bundle" --all
              git -C "data/output/$repo" bundle verify "../$repo.bundle"
              echo "bundled $repo"
            done
            exit "$status"
      outputs:
        artifacts:
          # One per target repo. Optional: a theme filter can leave a repo with nothing to build.
          - name: topographic-data
            path: /workspace/packages/kart-import/data/output/topographic-data.bundle
            optional: true
            archive:
              none: {} # the bundle is already compressed; keep it as a plain .bundle file
          - name: topographic-product-data
            path: /workspace/packages/kart-import/data/output/topographic-product-data.bundle
            optional: true
            archive:
              none: {}
          - name: topographic-contour-data
            path: /workspace/packages/kart-import/data/output/topographic-contour-data.bundle
            optional: true
            archive:
              none: {}

    - name: exit-handler
      retryStrategy:
        limit: '0' # `tpl-log-notification` retries itself
      steps:
        - - name: exit
            templateRef:
              name: tpl-log-notification
              template: main
            arguments:
              parameters:
                - name: workflow_status
                  value: '{{workflow.status}}'
                - name: workflow_parameters
                  value: '{{workflow.parameters}}'

  volumes:
    - name: data
      emptyDir: {}
