# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v4.1.6/api/jsonschema/schema.json

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pointcloud-standardising
  labels:
    linz.govt.nz/category: pointcloud
    linz.govt.nz/data-type: pointcloud
spec:
  parallelism: 50
  nodeSelector:
    karpenter.sh/capacity-type: 'spot'
  entrypoint: main
  onExit: exit-handler
  synchronization:
    semaphores:
      - configMapKeyRef:
          name: semaphores
          key: standardising
  workflowMetadata:
    labelsFrom:
      linz.govt.nz/user-group:
        expression: workflow.parameters.user_group
      linz.govt.nz/ticket:
        expression: workflow.parameters.ticket
      linz.govt.nz/region:
        expression: workflow.parameters.region
  podMetadata:
    labels:
      linz.govt.nz/user-group: '{{workflow.parameters.user_group}}'
      linz.govt.nz/category: pointcloud
      linz.govt.nz/data-type: pointcloud
      linz.govt.nz/ticket: '{{workflow.parameters.ticket}}'
      linz.govt.nz/region: '{{workflow.parameters.region}}'
  arguments:
    parameters:
      - name: version_argo_tasks
        description: 'Specify a version of the argo-tasks image to use, e.g. "v8" or "latest". It needs point cloud support in tileindex-validate.'
        value: 'v8'
      - name: version_geoprocessor_pointcloud
        description: 'Specify a version of the geoprocessor/pointcloud image to use, e.g. "v11" or "latest". It needs standardise-copc to merge tiles.'
        value: 'v11'
      - name: user_group
        description: Group of users running the workflow
        value: 'none'
        enum:
          - 'land'
          - 'sea'
          - 'none'
      - name: ticket
        description: 'Ticket ID, e.g. "LI-1570"'
        value: ''
      - name: region
        description: 'Region of the dataset from the list below'
        value: 'new-zealand'
        enum:
          - 'antarctica'
          - 'auckland'
          - 'bay-of-plenty'
          - 'canterbury'
          - 'chatham-islands'
          - 'gisborne'
          - 'global'
          - 'hawkes-bay'
          - 'manawatu-whanganui'
          - 'marlborough'
          - 'nelson'
          - 'new-zealand'
          - 'northland'
          - 'otago'
          - 'pacific-islands'
          - 'southland'
          - 'taranaki'
          - 'tasman'
          - 'waikato'
          - 'wellington'
          - 'west-coast'
      - name: source
        description: 'S3 location of the source dataset(s). Separate multiple sources with a semicolon (;). Where folders overlap, later sources (right) take priority'
        value: 's3://linz-elevation-staging/test/sample/'
      - name: include
        description: 'Regular expression pattern match for paths/files to include e.g "\.la[sz]$"'
        value: '\.la[sz]$'
      - name: scale
        description: 'Scale of the standardised output tiles. Each source file goes into the tile of its centroid.'
        value: '5000'
        enum:
          - '500'
          - '1000'
          - '2000'
          - '5000'
          - '10000'
          - '50000'
      - name: source_epsg
        description: '(Optional) EPSG of the source files, e.g. "2193". Leave blank to use the CRS in the file headers.'
        value: ''
      - name: source_vertical_epsg
        description: '(Optional) Vertical EPSG of the source files, e.g. "7839" for NZVD2016. Leave blank to use the CRS in the file headers.'
        value: ''
      - name: group
        description: 'How many output tiles to merge in each standardise-copc task "pod". Change if you have resource or performance issues when standardising a dataset.'
        value: '5'
      - name: group_size
        description: '(Optional) Also close a group when its source files reach this total size, e.g. "50Gi". Leave blank for no size limit.'
        value: ''
      - name: concurrency
        description: 'Number of output tiles to merge at the same time in each standardise-copc task "pod"'
        value: '1'
      - name: target
        description: '(Optional) S3 location to copy the standardised files to. Leave blank to keep them in the workflow scratch location only.'
        value: ''
      - name: copy_option
        description: 'Do not overwrite existing files with "no-clobber", "force" overwriting files in the target location, or "force-no-clobber" overwriting only changed files, skipping unchanged files'
        value: '--force-no-clobber'
        enum:
          - '--no-clobber'
          - '--force'
          - '--force-no-clobber'
      - name: aws_role_config_path
        description: 's3 URL or comma-separated list of s3 URLs allowing the workflow to write to the target'
        value: 's3://linz-bucket-config/config-write.elevation.json'
  templateDefaults:
    container:
      imagePullPolicy: Always
      image: ''
  templates:
    - name: main
      retryStrategy:
        expression: 'false'
      inputs:
        parameters:
          - name: source
      dag:
        tasks:
          - name: get-location
            templateRef:
              name: tpl-get-location
              template: main

          - name: tile-index-validate
            templateRef:
              name: tpl-at-tile-index-validate
              template: main
            arguments:
              parameters:
                - name: source_type
                  value: 'pointcloud'
                - name: scale
                  value: '{{=sprig.trim(workflow.parameters.scale)}}'
                - name: include
                  value: '{{workflow.parameters.include}}'
                - name: source
                  value: '{{=sprig.trim(inputs.parameters.source)}}'
                - name: source_epsg
                  value: '{{=sprig.trim(workflow.parameters.source_epsg)}}'
                - name: source_vertical_epsg
                  value: '{{=sprig.trim(workflow.parameters.source_vertical_epsg)}}'
                - name: version_argo_tasks
                  value: '{{= workflow.parameters.version_argo_tasks}}'

          - name: group
            templateRef:
              name: tpl-at-group
              template: main
            arguments:
              artifacts:
                - name: input
                  from: '{{ tasks.tile-index-validate.outputs.artifacts.files }}'
              parameters:
                - name: size
                  value: '{{=sprig.trim(workflow.parameters.group)}}'
                - name: group_size
                  value: '{{=sprig.trim(workflow.parameters.group_size)}}'
                - name: version_argo_tasks
                  value: '{{= workflow.parameters.version_argo_tasks}}'
            depends: 'tile-index-validate'

          - name: standardise-copc
            templateRef:
              name: tpl-gp-pointcloud-standardise-copc
              template: main
            arguments:
              parameters:
                - name: group_id
                  value: '{{item}}'
                - name: target
                  value: '{{=sprig.trimSuffix("/", tasks["get-location"].outputs.parameters.location)}}/flat/'
                - name: source_crs
                  value: '{{ tasks.tile-index-validate.outputs.parameters.crs }}'
                - name: concurrency
                  value: '{{=sprig.trim(workflow.parameters.concurrency)}}'
                - name: version_geoprocessor_pointcloud
                  value: '{{= workflow.parameters.version_geoprocessor_pointcloud}}'
              artifacts:
                - name: group_data
                  from: '{{ tasks.group.outputs.artifacts.output }}'
            depends: 'group && get-location'
            withParam: '{{ tasks.group.outputs.parameters.output }}'

          - name: copy-processed
            templateRef:
              name: copy
              template: main
            when: "'{{workflow.parameters.target}}' != ''"
            arguments:
              parameters:
                - name: source
                  value: '{{=sprig.trimSuffix("/", tasks["get-location"].outputs.parameters.location)}}/flat/'
                - name: target
                  value: '{{=sprig.trim(workflow.parameters.target)}}'
                - name: include
                  value: '\.copc\.laz$'
                - name: exclude
                  value: ''
                - name: copy_option
                  value: '{{workflow.parameters.copy_option}}'
                - name: aws_role_config_path
                  value: '{{workflow.parameters.aws_role_config_path}}'
                - name: flatten
                  value: 'false'
                - name: transform
                  value: 'f'
                - name: group
                  value: '1000'
                - name: group_size
                  value: '100Gi'
                - name: version_argo_tasks
                  value: '{{workflow.parameters.version_argo_tasks}}'
                - name: compress
                  value: 'false'
                - name: decompress
                  value: 'false'
                - name: delete_source
                  value: 'false'
                - name: delete_empty_folders
                  value: 'false'
            depends: 'standardise-copc'

      outputs:
        parameters:
          - name: target
            valueFrom:
              parameter: '{{tasks.get-location.outputs.parameters.location}}'
      # END TEMPLATE `main`

    - name: exit-handler
      retryStrategy:
        limit: '0' # `tpl-log-notification` retries itself
      steps:
        - - name: exit
            templateRef:
              name: tpl-log-notification
              template: main
            arguments:
              parameters:
                - name: workflow_status
                  value: '{{workflow.status}}'
                - name: workflow_parameters
                  value: '{{workflow.parameters}}'

  volumes:
    - name: ephemeral
      emptyDir: {}
