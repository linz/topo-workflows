version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /.github/workflows
      # Argo Workflow/WorkflowTemplate files are picked up as Kubernetes manifests
      # (top-level apiVersion + kind); only `image:` values with a literal tag are tracked
      - /workflows/**
      - /templates/**
    ignore:
      # Internal images (names exclude the registry host) are versioned via workflow parameters
      # or pinned on purpose (e.g. basemaps cli:v6), and live in private ECR registries
      - dependency-name: 'argo-tasks'
      - dependency-name: 'eks'
      - dependency-name: 'geoprocessor/*'
      - dependency-name: 'github/linz/*'
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-cdk:
        patterns:
          - '@aws-cdk/*'
          - 'aws-cdk'
          - 'aws-cdk-lib'
          - 'cdk8s'
          - 'cdk8s-cli'
          - 'cdk8s-plus-*'
          - 'constructs'
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
