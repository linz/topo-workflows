# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v3.6.12/api/jsonschema/schema.json

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # Template to output the content of a file in S3
  name: tpl-read-file
spec:
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: location
            description: Location of the file to read
            default: ''
      outputs:
        parameters:
          - name: content
            valueFrom:
              path: '/tmp/content'
      script:
        image: 'public.ecr.aws/aws-cli/aws-cli:2.39.7@sha256:73f81e380c7974c9f03ac7ccd520ef080f17f443e10582f024c828b970ac8b73'
        imagePullPolicy: IfNotPresent
        command: [sh]
        source: |
          aws s3 cp '{{inputs.parameters.location}}' /tmp/content
