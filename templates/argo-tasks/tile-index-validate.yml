# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v4.1.6/api/jsonschema/schema.json

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # Template from linz/argo-tasks
  # see https://github.com/linz/argo-tasks#tileindex-validate
  name: tpl-at-tile-index-validate
spec:
  templateDefaults:
    container:
      imagePullPolicy: Always
      image: ''
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: scale
            description: Tile Index scale to validate against or target scale for retiling. "auto" determines the appropriate scale based on input TIFFs GSD and preset, point clouds need a scale
            default: 'auto'

          - name: source_type
            description: Type of the input files, "raster" (TIFF) or "pointcloud" (LAS/LAZ, placed in the tile of their centroid)
            default: 'raster'
            enum:
              - 'raster'
              - 'pointcloud'

          - name: source_epsg
            description: Force source EPSG, point clouds can add a vertical EPSG, e.g. "2193+7839" for NZTM2000 + NZVD2016. "" will attempt to load EPSG from the source files
            default: ''

          - name: target_epsg
            description: Force target EPSG, "" will default to source EPSG
            default: ''

          - name: source
            description: Location to list
            default: ''

          - name: include
            description: Limit the input list to this regexp
            default: ''

          - name: includeDerived
            description: Sets includeDerived=true/false in file-list.json
            default: 'false'

          - name: preset
            description: Compression type of dataset e.g. webp, lzw, dem_lerc
            default: 'webp'

          - name: version_argo_tasks
            description: version of argo-tasks to use
            default: 'v8'

      outputs:
        parameters:
          - name: gsd
            description: 'GSD of the input TIFFs, empty for point clouds'
            valueFrom:
              path: /tmp/tile-index-validate/gsd

          - name: data_type
            description: 'Data type of the input TIFFs, empty for point clouds'
            valueFrom:
              path: /tmp/tile-index-validate/data-type

          - name: density
            description: 'Median point density of the input point clouds in points per m²'
            valueFrom:
              path: /tmp/tile-index-validate/density
              default: ''

          - name: point_format
            description: 'LAS point data record format of the input point clouds'
            valueFrom:
              path: /tmp/tile-index-validate/point-format
              default: ''

          - name: crs
            description: 'CRS of the input point clouds, e.g. "EPSG:2193+7839"'
            valueFrom:
              path: /tmp/tile-index-validate/crs
              default: ''

        artifacts:
          # Input files that need to be processed, per output tile
          - name: files
            path: /tmp/tile-index-validate/file-list.json
            optional: true
            archive:
              none: {}

          # GeoJSON containing the bounding boxes of all input files
          - name: input
            path: /tmp/tile-index-validate/input.geojson
            optional: true
            archive:
              none: {}

          # GeoJSON containing the bounding boxes of all the output tiles
          - name: output
            path: /tmp/tile-index-validate/output.geojson
            optional: true
            archive:
              none: {}

      container:
        image: '019359803926.dkr.ecr.ap-southeast-2.amazonaws.com/argo-tasks:{{=inputs.parameters.version_argo_tasks}}'
        env:
          - name: AWS_ROLE_CONFIG_PATH
            value: s3://linz-bucket-config/config.json
        args:
          - 'tileindex-validate'
          - '--verbose'
          - '--scale={{= inputs.parameters.scale }}'
          - '--preset={{= inputs.parameters.preset }}'
          - '--source-type={{= inputs.parameters.source_type }}'
          - "{{= sprig.empty(inputs.parameters.source_epsg) ? '' : '--source-epsg=' + inputs.parameters.source_epsg }}"
          - "{{= sprig.empty(inputs.parameters.target_epsg) ? '' : '--target-epsg=' + inputs.parameters.target_epsg }}"
          - "{{= sprig.empty(inputs.parameters.include) ? '' : '--include=' + inputs.parameters.include }}"
          - '--includeDerived={{= inputs.parameters.includeDerived }}'
          - '{{= sprig.trim(inputs.parameters.source) }}'
        resources:
          requests:
            memory: 3.9Gi
