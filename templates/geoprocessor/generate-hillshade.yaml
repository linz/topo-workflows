# yaml-language-server: $schema=https://raw.githubusercontent.com/argoproj/argo-workflows/v3.6.12/api/jsonschema/schema.json

apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  # Template calling linz/geoprocessor for its main task (generate-hillshade)
  # see https://github.com/linz/geoprocessor/blob/master/packages/geoprocessor-raster/src/geoprocessor_raster/generate_hillshade.py
  name: tpl-ti-generate-hillshade
  labels:
    linz.govt.nz/category: raster
spec:
  templateDefaults:
    container:
      imagePullPolicy: Always
      image: ''
  entrypoint: main
  templates:
    - name: main
      inputs:
        parameters:
          - name: version_geoprocessor_raster
            description: 'Specify a version of the geoprocessor/raster image to use, e.g. "v8.1" or "latest"'
            default: 'v8'

          - name: group_id
            description: 'The ID of the group of files to use as the input.'
            default: ''

          - name: odr_url
            description: '(Optional) The path of the published dataset. Example: "s3://nz-elevation/new-zealand/new-zealand/dem-hillshade_1m/2193/"'
            default: ''

          - name: target
            description: 'Location for output files'
            default: ''

          - name: hillshade_preset
            description: 'Hillshade preset to use, must be one of "hillshade" or "hillshade-igor"'
            default: ''

          - name: collection_id
            description: 'Collection ID of existing dataset, or else a generated collection ID'
            default: ''

          - name: current_datetime
            description: 'Current date and time of the workflow'
            default: ''

        artifacts:
          - name: group_data
            path: /tmp/input/

      container:
        image: '019359803926.dkr.ecr.ap-southeast-2.amazonaws.com/geoprocessor/raster:{{=sprig.trim(inputs.parameters.version_geoprocessor_raster)}}'
        resources:
          requests:
            memory: 7.8Gi
            cpu: 15000m
            ephemeral-storage: 29.5Gi
        volumeMounts:
          # This volume must be defined in the workflow calling this workflowTemplate
          - name: ephemeral
            mountPath: '/tmp'
        args:
          - python
          - '/app/scripts/generate_hillshade.py'
          - '--is-argo'
          - '--from-file'
          - '/tmp/input/{{inputs.parameters.group_id}}.json'
          - '--target'
          - '{{=sprig.trimSuffix("/", inputs.parameters.target)}}/'
          - '--preset'
          - '{{inputs.parameters.hillshade_preset}}'
          - '--collection-id'
          - '{{inputs.parameters.collection_id}}'
          - '--current-datetime'
          - '{{inputs.parameters.current_datetime}}'
          - '--odr-url'
          - '{{inputs.parameters.odr_url}}'
